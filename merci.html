<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci — Carmelys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .thanks-page {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 20px;
  }
  .thanks-card {
    background: var(--paper, #f5f2eb);
    border: 1px solid var(--line, #e0dbd1);
    border-radius: 12px;
    padding: 40px 24px;
    max-width: 500px;
    width: 100%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
  }
  .thanks-card h1 {
    font-family: 'Fraunces', serif;
    font-size: 2rem;
    margin-bottom: 16px;
    color: #111;
  }
  .thanks-card p {
    color: #555;
    line-height: 1.6;
    margin-bottom: 28px;
  }
</style>
</head>
<body>

<header class="site">
  <div class="wrap nav">
    <a href="index.html" class="logo"><img src="assets/img/logo.png" alt="Carmelys" class="logo-mark"></a>
  </div>
</header>

<main class="thanks-page">
  <div class="thanks-card">
    <h1>Demande bien reçue !</h1>
    <p>Merci de nous avoir contactés. L'équipe Carmelys étudie votre projet et vous recontactera sous 24h ouvrées.</p>
    <a href="index.html" class="btn btn-dark">Retourner à l'accueil</a>
  </div>
</main>

<footer class="site">
  <div class="wrap">
    <div class="footer-bottom">
      <span>© 2026 Carmelys — Tout corps d'état</span>
      <span>06 35 42 00 92</span>
    </div>
  </div>
